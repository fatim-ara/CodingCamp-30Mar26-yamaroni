<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense and Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="storage-warning" class="storage-warning" role="alert" aria-live="polite" hidden>
      Warning: Storage is unavailable. Your data will not be saved.
    </div>

    <header>
      <h1>Expense and Budget Visualizer</h1>
      <div class="balance-display">
        <span>Total Balance:</span>
        <span id="balance">$0.00</span>
      </div>
    </header>

    <main>
      <section id="form" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
            />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <div id="form-error" class="form-error" role="alert" aria-live="polite"></div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <section id="list" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list"></ul>
      </section>

      <section id="chart" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart" aria-label="Spending pie chart" role="img"></canvas>
          <p id="chart-empty" class="empty-state">No transactions yet. Add one to see your spending chart.</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
